name: Release

# A v* tag releases that version: the GitHub release with its notes from
# CHANGELOG.md, the Helm chart (attached, and pushed to GHCR as an OCI chart),
# and the compose bundle. The images are not built here: images.yml already
# builds, pushes and signs them for every v* tag, so this waits for those.
#
# Run by hand with `tag` to release a tag that already exists. With `dry_run`,
# or for a tag that does not exist yet, it runs every check and builds every
# asset from the branch it was started on, and publishes nothing. Pull requests
# get the same dry run for the version in the tree.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.1.0
        required: true
        type: string
      dry_run:
        description: Check and build everything, publish nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Choose the source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$EVENT" in
            push)
              echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
              if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${INPUT_TAG}" >/dev/null 2>&1; then
                echo "ref=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"
                echo "publish=$([ "$DRY_RUN" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
              elif [ "$DRY_RUN" = true ]; then
                echo "::notice::${INPUT_TAG} does not exist, so this dry run builds ${GITHUB_REF_NAME}"
                echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                echo "publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::${INPUT_TAG} is not a tag. Push the tag first, or check dry_run to rehearse it."
                exit 1
              fi
              ;;
            *)
              # The tag is read from the tree once it is checked out.
              echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Plan
        id: plan
        env:
          TAG: ${{ steps.source.outputs.tag }}
          PUBLISH: ${{ steps.source.outputs.publish }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="v$(grep -m1 -oP '^version\s*=\s*"\K[^"]+' gateway/Cargo.toml)"
          fi
          version="${TAG#v}"
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
            echo "publish=${PUBLISH}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: The tag matches every version in the tree
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: python3 .github/scripts/check-release-version.py "$TAG"

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          python3 .github/scripts/changelog-section.py "$TAG" > notes.md
          download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat >> notes.md <<EOF

          ## Install

          With Docker Compose:

          \`\`\`bash
          curl -fsSL ${download}/felix-canvas-compose-${VERSION}.tar.gz | tar xz
          cd felix-canvas-compose-${VERSION}
          # change FELIX_BOOTSTRAP_TOKEN and FELIX_RAFT_PEER_TOKEN in .env first
          docker compose up -d
          \`\`\`

          On Kubernetes, next to the Felix chart:

          \`\`\`bash
          helm install felix-canvas oci://ghcr.io/${OWNER}/charts/felix-canvas --version ${VERSION} -f canvas-values.yaml
          \`\`\`

          [docs/self-hosting.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/self-hosting.md) covers your own identity provider, TLS, backups, upgrades and the chart's values.
          EOF
          cat notes.md

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Package the chart
        run: |
          helm lint deploy/helm/felix-canvas
          helm package deploy/helm/felix-canvas --destination dist

      # The whole directory, so files added beside the compose file ship
      # without a change here.
      - name: Bundle the compose install
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          name="felix-canvas-compose-${VERSION}"
          mkdir -p "stage/${name}"
          cp -a deploy/compose/. "stage/${name}/"
          # The version check already holds these at the version; this keeps
          # the bundle pinned even if a default were added without one.
          find "stage/${name}" -name '*.y*ml' -exec \
            sed -i -E "s/\\\$\\{CANVAS_VERSION:-[^}]*\\}/\${CANVAS_VERSION:-${VERSION}}/g" {} +
          # shellcheck disable=SC2016
          grep -h -o 'felix-canvas[a-z-]*:${CANVAS_VERSION:-[^}]*}' "stage/${name}"/*.y*ml | sort -u
          (cd "stage/${name}" && docker compose config --quiet)
          tar -C stage --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -czf "dist/${name}.tar.gz" "${name}"
          tar -tzf "dist/${name}.tar.gz"

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Most of this is waiting for images.yml, which takes up to an hour.
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      actions: read
      # Keyless signing of the chart, as images.yml signs the images.
      id-token: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - uses: sigstore/cosign-installer@v3

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # images.yml is the only workflow that publishes images. Done means the
      # tag's manifest list exists and carries images.yml's signature for this
      # tag; a failed images.yml run for the tag ends the wait.
      - name: Wait for the images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/images.yml@refs/tags/${TAG}"
          : > images.md
          for image in felix-canvas felix-canvas-snapshotter; do
            ref="ghcr.io/${OWNER}/${image}"
            for try in $(seq 1 160); do
              digest=$(docker buildx imagetools inspect "${ref}:${VERSION}" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true)
              if [ -n "$digest" ] && cosign verify "${ref}@${digest}" \
                  --certificate-identity "$identity" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
                echo "${ref}:${VERSION} is ${digest}, signed"
                echo "| \`${ref}:${VERSION}\` | \`${digest}\` |" >> images.md
                break
              fi
              run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow images.yml --branch "$TAG" --limit 1 \
                --json status,conclusion,url --jq '.[0] // empty | "\(.status) \(.conclusion) \(.url)"')
              read -r status conclusion url <<< "$run"
              if [ "$status" = completed ] && [ "$conclusion" != success ]; then
                echo "::error::images.yml for ${TAG} ended ${conclusion}: ${url}"
                exit 1
              fi
              if [ "$try" = 160 ]; then
                echo "::error::${ref}:${VERSION} was not published and signed within 80 minutes"
                exit 1
              fi
              echo "waiting for ${ref}:${VERSION} (images.yml: ${status:-not started})"
              sleep 30
            done
          done

      # A chart version already in the registry is attached as it is rather
      # than pushed again, so a re-run neither moves the tag nor attaches a
      # chart that differs from the published one.
      - name: Push the chart
        id: chart
        run: |
          repo="oci://ghcr.io/${OWNER}/charts"
          echo "$GITHUB_TOKEN_FOR_HELM" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p existing
          if out=$(helm pull "${repo}/felix-canvas" --version "$VERSION" --destination existing 2>&1); then
            echo "${repo}/felix-canvas ${VERSION} is already published; attaching that copy"
            cp "existing/felix-canvas-${VERSION}.tgz" "dist/felix-canvas-${VERSION}.tgz"
            (cd dist && sha256sum -- *.tgz *.tar.gz > SHA256SUMS)
          else
            out=$(helm push "dist/felix-canvas-${VERSION}.tgz" "$repo" 2>&1)
          fi
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<< "$out")
          [ -n "$digest" ] || { echo "::error::no digest for the chart"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN_FOR_HELM: ${{ secrets.GITHUB_TOKEN }}

      # By digest, as the images are, so the signature cannot follow a moved tag.
      - name: Sign the chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${OWNER}/charts/felix-canvas@${DIGEST}"

      - name: Release notes
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          {
            echo
            echo "## Images and chart"
            echo
            echo "| Reference | Digest |"
            echo "|---|---|"
            cat images.md
            echo "| \`oci://ghcr.io/${OWNER}/charts/felix-canvas:${VERSION}\` | \`${CHART_DIGEST}\` |"
            echo
            echo "All three are signed with cosign; [docs/self-hosting.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/self-hosting.md#what-runs) shows how to verify them."
          } >> notes.md
          cat notes.md
          cat dist/SHA256SUMS

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Felix Canvas ${{ env.TAG }}
          body_path: notes.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/felix-canvas-${{ env.VERSION }}.tgz
            dist/felix-canvas-compose-${{ env.VERSION }}.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
