name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  gateway-felix:
    name: Gateway against Felix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test --locked --no-run
      - name: Start Felix
        run: dev/up.sh
      - name: Integration tests
        run: |
          export CANVAS_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          cargo test --locked --test relay -- --include-ignored --nocapture
      - name: Felix logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Every lockfile entry comes from npmjs with a sha512 hash
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const bad = Object.entries(lock.packages)
              .filter(([path, entry]) => path.includes("node_modules/") && !entry.link)
              .filter(([, entry]) =>
                !entry.resolved?.startsWith("https://registry.npmjs.org/") ||
                !entry.integrity?.startsWith("sha512-"));
            for (const [path, entry] of bad) console.error(path, entry.resolved, entry.integrity);
            process.exit(bad.length ? 1 : 0);
          '
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  browsers:
    name: Two browsers against Felix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @felix-canvas/model
      - name: Build the gateway
        run: cargo build --locked -p felix-canvas-gateway
      - name: Install Chromium
        run: npx -w @felix-canvas/web playwright install --with-deps chromium
      - name: Start Felix
        run: dev/up.sh
      - name: Playwright
        run: npm run test:e2e -w @felix-canvas/web
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
      - name: Felix logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs

  # Its own job because it needs three brokers instead of one, and stops one of
  # them; the other jobs share a single-broker stack.
  failover:
    name: Failover against a Felix cluster
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANVAS_FELIX_CLUSTER: "1"
      CANVAS_FELIX_BROKERS: 127.0.0.1:5000,127.0.0.1:5010,127.0.0.1:5020
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @felix-canvas/model
      - name: Build the gateway
        run: cargo build --locked -p felix-canvas-gateway
      - name: Install Chromium
        run: npx -w @felix-canvas/web playwright install --with-deps chromium
      - name: Start three brokers
        run: dev/up.sh --cluster
      - name: Playwright
        run: npm run test:e2e -w @felix-canvas/web -- failover
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failover-report
          path: web/playwright-report/
      - name: Felix logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml -f dev/docker-compose.cluster.yml logs
