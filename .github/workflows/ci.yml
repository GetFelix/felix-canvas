name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  gateway-felix:
    name: Gateway against Felix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test --locked --no-run
      - name: Start Felix
        run: dev/up.sh
      - name: Integration tests
        run: |
          export CANVAS_FELIX_TOKEN="$(cat dev/state/gateway.token)"
          export CANVAS_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          cargo test --locked --test relay -- --include-ignored --nocapture
      - name: Felix logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Every lockfile entry comes from npmjs with a sha512 hash
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const bad = Object.entries(lock.packages)
              .filter(([path, entry]) => path.includes("node_modules/") && !entry.link)
              .filter(([, entry]) =>
                !entry.resolved?.startsWith("https://registry.npmjs.org/") ||
                !entry.integrity?.startsWith("sha512-"));
            for (const [path, entry] of bad) console.error(path, entry.resolved, entry.integrity);
            process.exit(bad.length ? 1 : 0);
          '
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
