# Runs the integration tests against Felix main every night. Felix's own nightly
# build is scheduled for 04:41 UTC and often starts hours late, so this runs
# well after it.
# A failure opens (or updates) an issue labelled felix-nightly; a green run
# closes it. The steps are in GetFelix/.github, and the repo's part is
# .github/felix-nightly.sh.
name: Felix nightly

on:
  schedule:
    - cron: "37 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    permissions:
      contents: read
      issues: write
    uses: GetFelix/.github/.github/workflows/felix-nightly.yml@main
    with:
      timeout_minutes: 60
